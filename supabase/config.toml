# Picartdo Supabase local config
project_id = "picartdo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "picartdo://auth-callback"
additional_redirect_urls = ["picartdo://auth-callback"]
enable_signup = true

[auth.external.apple]
enabled = true

[storage]
enabled = true
file_size_limit = "20MiB"

[functions]
verify_jwt = true
